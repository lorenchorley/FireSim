<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbbc04" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="FireSim — learn how bushfires behave in the mountains of NSW. A training aid, not an operational prediction tool." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23111418'/%3E%3Cpath d='M12 21c3.6 0 6-2.4 6-5.6 0-2.9-1.9-4.7-3.1-6.5-.4 1.4-1.2 2.2-2.2 2.6C13.2 8.3 12 5.7 10 3.9c.2 3-1.5 4.9-2.8 6.6C6.4 11.6 6 12.9 6 15c0 3.3 2.4 6 6 6z' fill='%23ff7a1a'/%3E%3C/svg%3E" />
    <title>FireSim — mountain bushfire trainer</title>
    <script>
      // Apply the stored / system theme and the high-contrast variant before first paint to avoid a flash.
      // (Colours: THEME_CHROME in src/ui/settings.ts. The theme-color meta is the status-bar colour: the amber strip, the
      // same with or without high contrast; src/ui/settings.ts applyAppearance takes over once the app has started.)
      (function () {
        try {
          var p = new URLSearchParams(location.search);
          var q = p.get('theme');
          var saved = JSON.parse(localStorage.getItem('firesim.settings') || '{}');
          var s = saved.theme || 'system';
          var t = q === 'light' || q === 'dark' ? q : s === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : s;
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
          if (p.get('contrast') === 'high' || saved.highContrast === true) document.documentElement.dataset.contrast = 'high';
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'dark' ? '#e0a100' : '#fbbc04');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app" class="app">
      <div class="boot-splash" role="status" aria-live="polite">
        <span class="boot-mark" aria-hidden="true"></span>
        <p>Loading FireSim…</p>
      </div>
    </div>
    <noscript>FireSim needs JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
