<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FireSim render harness</title>
    <style>
      :root {
        --panel: rgba(12, 16, 24, 0.82);
        --text: #f2f4f8;
        --muted: #aeb6c4;
        --accent: #ff8c1a;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b1020;
        color: var(--text);
        font: 15px/1.35 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
      }
      #view {
        position: fixed;
        inset: 0;
      }
      .hud {
        position: fixed;
        left: 8px;
        right: 8px;
        bottom: calc(8px + env(safe-area-inset-bottom));
        background: var(--panel);
        border-radius: 14px;
        padding: 10px;
        display: grid;
        gap: 8px;
        backdrop-filter: blur(6px);
      }
      .row {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
      }
      button,
      select {
        min-height: 44px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
        font: inherit;
        padding: 0 12px;
      }
      button.on {
        background: var(--accent);
        color: #111;
        border-color: var(--accent);
        font-weight: 600;
      }
      input[type='range'] {
        flex: 1;
        accent-color: var(--accent);
        min-height: 36px;
      }
      #clock {
        min-width: 86px;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
      }
      #stats {
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .legend {
        position: fixed;
        top: calc(10px + env(safe-area-inset-top));
        left: 10px;
        max-width: 250px;
        background: var(--panel);
        border-radius: 12px;
        padding: 10px 12px;
        font-size: 13px;
      }
      .legend h3 {
        margin: 0 0 6px;
        font-size: 14px;
      }
      .legend .bar {
        height: 12px;
        border-radius: 6px;
        border: 1px solid rgba(0, 0, 0, 0.6);
      }
      .legend .ticks {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 11px;
        margin-top: 2px;
      }
      .legend .sw {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 3px;
        margin-right: 6px;
        vertical-align: -2px;
        border: 1px solid rgba(0, 0, 0, 0.5);
      }
      .legend .note {
        color: var(--muted);
        font-size: 11px;
        margin-top: 6px;
      }
      .banner {
        position: fixed;
        top: calc(10px + env(safe-area-inset-top));
        right: 10px;
        background: rgba(12, 16, 24, 0.7);
        color: #ffd28a;
        border-radius: 10px;
        padding: 6px 10px;
        font-size: 11px;
        max-width: 140px;
        text-align: right;
      }
      .hidden {
        display: none !important;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div id="loading">Loading terrain…</div>
    <div class="legend hidden" id="legend"></div>
    <div class="banner" id="banner">Training aid — not an operational prediction</div>
    <div class="hud" id="hud">
      <div class="row">
        <button data-view="orbit" class="on">3D</button>
        <button data-view="top">Plan</button>
        <button data-view="ground">Eye level</button>
        <select id="overlay" aria-label="Overlay">
          <option value="none">No overlay</option>
          <option value="arrival">Arrival time</option>
          <option value="ros">Spread rate</option>
          <option value="intensity">Intensity</option>
          <option value="driver">Why it spread</option>
          <option value="moisture">Fuel moisture</option>
          <option value="fuelLoad">Fuel load</option>
          <option value="fuelType">Fuel type</option>
          <option value="timeSinceFire">Time since fire</option>
          <option value="slope">Slope</option>
          <option value="aspect">Aspect</option>
          <option value="insolation">Sun on slope</option>
        </select>
      </div>
      <div class="row">
        <button id="play">▶</button>
        <input id="time" type="range" min="0" max="21600" step="300" value="10800" aria-label="Time" />
        <span id="clock">--:--</span>
      </div>
      <div class="row">
        <select id="wind" aria-label="Wind">
          <option value="off">Wind off</option>
          <option value="surface">Surface wind</option>
          <option value="volume">3-D wind</option>
        </select>
        <button id="section">Section</button>
        <button id="imagery" class="on">Photo</button>
        <button id="veg" class="on">Trees</button>
      </div>
      <div id="stats"></div>
    </div>
    <script type="module" src="./dev.ts"></script>
  </body>
</html>
