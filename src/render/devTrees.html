<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FireSim canopy harness</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b1020;
        color: #f2f4f8;
        font: 14px/1.35 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
      }
      #view {
        position: fixed;
        inset: 0;
      }
      #stats {
        position: fixed;
        left: 6px;
        bottom: 6px;
        right: 6px;
        background: rgba(12, 16, 24, 0.7);
        border-radius: 8px;
        padding: 4px 8px;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }
      #legend {
        position: fixed;
        top: 8px;
        left: 8px;
        max-width: 230px;
        background: rgba(12, 16, 24, 0.82);
        border-radius: 10px;
        padding: 8px 10px;
        font-size: 12px;
      }
      #legend h3 {
        margin: 0 0 4px;
        font-size: 13px;
      }
      #legend .sw {
        display: inline-block;
        width: 11px;
        height: 11px;
        border-radius: 3px;
        margin-right: 6px;
        vertical-align: -1px;
      }
      #legend .bar {
        height: 10px;
        border-radius: 5px;
      }
      #legend .note {
        color: #aeb6c4;
        font-size: 11px;
        margin-top: 4px;
      }
      .hidden {
        display: none !important;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #aeb6c4;
      }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div id="legend" class="hidden"></div>
    <div id="stats"></div>
    <div id="loading">Loading…</div>
    <script type="module" src="./devTrees.ts"></script>
  </body>
</html>
