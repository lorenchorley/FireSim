<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FireSim legends gallery</title>
    <style>
      /* Development page: every heat-map legend chip and every catalog row, in both themes, for a visual check.
         ?theme=light|dark|both (default both)  ?cvd=protan|deutan|tritan (simulate colour blindness)  ?catalog=0 (chips only)
         ?ctx=none|all (availability of the catalog rows)  ?elev=312,1047 (site height range for the elevation legend) */
      :root {
        --bg: #f4f1ea;
        --card: #ffffff;
        --text: #1d2229;
        --muted: #5d6673;
        --line: rgba(0, 0, 0, 0.16);
        --warn: #8a4b00;
      }
      .dark {
        --bg: #10151d;
        --card: #1b222d;
        --text: #eef1f6;
        --muted: #a5afbd;
        --line: rgba(255, 255, 255, 0.2);
        --warn: #ffbf69;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font: 14px/1.35 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #888;
      }
      #root {
        display: flex;
        flex-wrap: wrap;
        gap: 0;
        align-items: flex-start;
      }
      .theme {
        width: 412px;
        background: var(--bg);
        color: var(--text);
        padding: 12px 16px 24px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 8px;
      }
      h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin: 18px 0 6px;
      }
      .chip,
      .row {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
        margin: 0 0 8px;
      }
      .chip h3,
      .row h3 {
        margin: 0 0 6px;
        font-size: 14px;
      }
      .units {
        font-weight: 400;
        color: var(--muted);
      }
      .bar {
        height: 14px;
        border-radius: 7px;
        border: 1px solid var(--line);
      }
      canvas.lut {
        display: block;
        width: 100%;
        height: 6px;
        margin-top: 3px;
        border-radius: 3px;
        image-rendering: pixelated;
      }
      .ticks {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 11px;
        margin-top: 2px;
      }
      .ticks span {
        text-align: center;
        flex: 1 1 0;
      }
      .ticks b {
        display: block;
        color: var(--text);
        font-weight: 600;
      }
      .item {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin: 3px 0;
      }
      .sw {
        flex: none;
        width: 16px;
        height: 16px;
        border-radius: 4px;
        border: 1px solid var(--line);
        margin-top: 1px;
      }
      .sw.lut {
        width: 8px;
        margin-left: -4px;
        border-radius: 0 4px 4px 0;
        border-left: 0;
      }
      .item small {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }
      .nodata .sw {
        background-image: repeating-linear-gradient(45deg, transparent 0 3px, var(--line) 3px 4px);
      }
      .note {
        color: var(--muted);
        font-size: 12px;
        margin-top: 6px;
      }
      .badge {
        display: inline-block;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 1px 6px;
        border-radius: 8px;
        border: 1px solid var(--line);
        color: var(--muted);
        margin-right: 4px;
      }
      .row p {
        margin: 3px 0;
      }
      .row .why {
        color: var(--muted);
      }
      .row .meta {
        font-size: 11px;
        color: var(--muted);
      }
      .row .unavailable {
        color: var(--warn);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <!-- Machado et al. (2009) colour-blindness simulations, full severity, in linear RGB -->
      <filter id="protan" color-interpolation-filters="linearRGB">
        <feColorMatrix type="matrix" values="0.152286 1.052583 -0.204868 0 0  0.114503 0.786281 0.099216 0 0  -0.003882 -0.048116 1.051998 0 0  0 0 0 1 0" />
      </filter>
      <filter id="deutan" color-interpolation-filters="linearRGB">
        <feColorMatrix type="matrix" values="0.367322 0.860646 -0.227968 0 0  0.280085 0.672501 0.047413 0 0  -0.01182 0.04294 0.968881 0 0  0 0 0 1 0" />
      </filter>
      <filter id="tritan" color-interpolation-filters="linearRGB">
        <feColorMatrix type="matrix" values="1.255528 -0.076749 -0.178779 0 0  -0.078411 0.930809 0.147602 0 0  0.004733 0.691367 0.3039 0 0  0 0 0 1 0" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="./legendGallery.ts"></script>
  </body>
</html>
